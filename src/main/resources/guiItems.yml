    itemStack:
      material: minecraft:stone
      cmd: 1
cosmetics:
  hat1:
    rightCommand: <<<UNEQUIP>>>
    leftCommand: <<<EQUIP/EXIT UI>>>
    itemStack:
      material: minecraft:stone
      cmd: 4
      lore:
        - {"text": "A stunning piece of kit, previously worn by Gimli son of Glóin. Only Aulë knows how you got a hold of it…","color": "#d4d4d4"}
        - ""
        - {"text":"Patreon:","color":"#cd6a18","shadow_color":6500616,"bold":true,"extra":[{"text":"Dwarf Tier","color":"#cccccc"}]}
        - {"text": "Right click to unequip.","color": "#919191"}
      name: {"text": "Gimli's Helmet","color":"#cccccc","shadow_color": 0,"bold": true }
  hat2:
    rightCommand: <<<UNEQUIP>>>
    leftCommand: <<<EQUIP/EXIT UI>>>
    itemStack:
      material: minecraft:stone
      cmd: 9
      lore:
        - {"text": "Highly sought after headgear worn by virtually everyone but this one in particular was owned by the one they use to call Strider.","color": "#d4d4d4"}
        - ""
        - {"text":"Patreon:","color":"#cd6a18","shadow_color":6500616,"bold":true,"extra":[{"text":"Dúnadan Tier","color":"#cccccc"}]}
        - {"text": "Right click to unequip.","color": "#919191"}
      name: {"text": "Aragorn's Hood","color":"#cccccc","shadow_color": 0,"bold": true }
  hat3:
    rightCommand: <<<UNEQUIP>>>
    leftCommand: <<<EQUIP/EXIT UI>>>
    itemStack:
      material: minecraft:stone
      cmd: 10
      lore:
        - {"text": "This may look like a pile of sticks but at some point it used to belong to the King of the Woodland Realm. It also seems to have a particularly strong… magical effect on its wearer's ears…","color": "#d4d4d4"}
        - ""
        - {"text":"Patreon:","color":"#cd6a18","shadow_color":6500616,"bold":true,"extra":[{"text":"Elf Tier","color":"#cccccc"}]}
        - {"text": "Right click to unequip.","color": "#919191"}
      name: {"text": "Tharanduil's Crown","color":"#cccccc","shadow_color": 0,"bold": true }
  hat4:
    rightCommand: <<<UNEQUIP>>>
    leftCommand: <<<EQUIP/EXIT UI>>>
    itemStack:
      material: minecraft:stone
      cmd: 11
      lore:
        - {"text": "Pointy hat. You know what that means… it was probably stolen from a wizard. You are in trouble.","color": "#d4d4d4"}
        - ""
        - {"text":"Patreon:","color":"#cd6a18","shadow_color":6500616,"bold":true,"extra":[{"text":"Maiar Tier","color":"#cccccc"}]}
        - {"text": "Right click to unequip.","color": "#919191"}
      name: {"text": "Gandalf's Hat","color":"#cccccc","shadow_color": 0,"bold": true }
  hat5:
    rightCommand: <<<UNEQUIP>>>
    leftCommand: <<<EQUIP/EXIT UI>>>
    itemStack:
      material: minecraft:stone
      cmd: 15
      lore:
        - {"text": "Ul ukhadow ro mausan purpouke lieuk upon arda, agh gith avhaav iuk shal iav benduk uklowpak agh ukurepak avo mausan liwo.","color": "#d4d4d4"}
        - ""
        - {"text":"Patreon:","color":"#cd6a18","shadow_color":6500616,"bold":true,"extra":[{"text":"The Eye Tier","color":"#cccccc"}]}
        - {"text": "Right click to unequip.","color": "#919191"}
      name: {"text": "The Eye","color":"#cccccc","shadow_color": 0,"bold": true }

